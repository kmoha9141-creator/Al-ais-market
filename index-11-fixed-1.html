<!--
هذه نسخة Single-File مرتبطة مباشرة بـ Cloud Firestore للاختبار.
لا تستخدم Firebase Storage؛ الصور تُضغط وتُحفظ في Firestore داخل مجموعة media.
ليست Production Backend.

Production:
- يجب تنفيذ RBAC بواسطة Firebase Authentication + Custom Claims + Firestore Security Rules.
- هذه النسخة لا تستخدم Firebase Storage؛ الصور داخل Firestore في مجموعة media.
- Production: استخدم Firestore/Cloud Functions للعمليات الحساسة وسجل الإدارة فقط.
- عند تحويل النسخة إلى Production يجب إضافة Authentication وRBAC وSecurity Rules دقيقة وApp Check وCloud Functions عند الحاجة.
- المفضلة للزائر تُحفظ في Firestore تحت favorites/{deviceId}; localStorage يُستخدم فقط لحفظ deviceId/session state.
-->

/* =========================
   FIRESTORE DATA LAYER — FIRESTORE ONLY / NO STORAGE
   =========================
   Firestore is the source of truth for application data.
   The browser keeps the current state in memory only; localStorage is used
   only for device/session preferences such as login persistence and device id.

   Images are NOT sent to Firebase Storage. They are resized/compressed in the
   browser, stored as separate Firestore documents in `media`, and referenced
   from the owning record as `media://<mediaId>`.
*/
const FIRESTORE_COLLECTIONS = [
  'users','shops','products','specialOffers','categories',
  'promotionRequests','advertisements','services','auditLogs'
];
const FIRESTORE_ID_FIELDS = {
  users:'id',
  shops:'shopId',
  products:'productId',
  specialOffers:'offerId',
  categories:'id',
  promotionRequests:'requestId',
  advertisements:'advertisementId',
  services:'serviceId',
  auditLogs:'logId'
};
const IMAGE_FIELDS = ['logo','coverImage','image'];
const MEDIA_COLLECTION = 'media';
let firestoreReady=false;
let firestoreLoading=false;
let firestoreSyncTimer=null;
let firestoreSyncPending=false;
let firestoreInitialLoadDone=false;

function getFirebase(){
  return window.__AIS_FIREBASE__?.db ? window.__AIS_FIREBASE__ : null;
}

function firestoreIdFor(name,record,index=0){
  const field=FIRESTORE_ID_FIELDS[name];
  let id=field ? record?.[field] : null;
  if(!id && name==='services'){
    id='service_'+(record?.shopId||'shop')+'_'+index;
    if(record)record.serviceId=id;
  }
  if(!id)id=name+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
  return String(id).replace(/[\\/#?\[\]]/g,'_');
}

function cleanForFirestore(value){
  if(value===undefined)return undefined;
  if(typeof value==='number'&&!Number.isFinite(value))return null;
  if(Array.isArray(value))return value.map(cleanForFirestore).filter(v=>v!==undefined);
  if(value&&typeof value==='object'){
    const out={};
    Object.entries(value).forEach(([k,v])=>{
      const c=cleanForFirestore(v);
      if(c!==undefined)out[k]=c;
    });
    return out;
  }
  return value;
}

function mediaIdFor(name,docId,field){
  return `media_${name}_${docId}_${field}`.replace(/[^A-Za-z0-9_-]/g,'_');
}

async function ensureFirestoreMedia(dataUrl,mediaId){
  const fb=getFirebase();
  if(!fb||!dataUrl||!String(dataUrl).startsWith('data:'))return dataUrl;
  // Firestore document limit is 1 MiB. Keep the encoded image comfortably below it.
  if(String(dataUrl).length>800000){
    throw new Error('الصورة كبيرة جداً بعد الضغط. اختر صورة أصغر.');
  }
  const payload={
    mediaId,
    dataUrl:String(dataUrl),
    mimeType:String(dataUrl).match(/^data:([^;,]+)/)?.[1]||'image/jpeg',
    updatedAt:new Date().toISOString()
  };
  await fb.setDoc(
    fb.doc(fb.db,MEDIA_COLLECTION,mediaId),
    cleanForFirestore(payload),
    {merge:true}
  );
  return 'media://'+mediaId;
}

async function prepareFirestoreRecord(name,record,docId){
  const out=JSON.parse(JSON.stringify(record||{}));
  for(const field of IMAGE_FIELDS){
    if(typeof out[field]==='string'&&out[field].startsWith('data:')){
      out[field]=await ensureFirestoreMedia(out[field],mediaIdFor(name,docId,field));
    }
  }
  if(name==='services'&&!out.serviceId)out.serviceId=docId;
  out._syncedAt=new Date().toISOString();
  return cleanForFirestore(out);
}

async function hydrateFirestoreRecord(record){
  const fb=getFirebase();
  if(!fb)return record;
  const out={...record};
  for(const field of IMAGE_FIELDS){
    const ref=out[field];
    if(typeof ref==='string'&&ref.startsWith('media://')){
      try{
        const snap=await fb.getDoc(fb.doc(fb.db,MEDIA_COLLECTION,ref.slice(8)));
        if(snap.exists())out[field]=snap.data().dataUrl||'';
        else out[field]='';
      }catch(e){
        console.warn('تعذر تحميل صورة Firestore',e);
      }
    }
  }
  delete out._syncedAt;
  delete out.__docId;
  return out;
}

async function getFirestoreCollectionRecords(name){
  const fb=getFirebase();
  if(!fb)return [];
  const snap=await fb.getDocs(fb.collection(fb.db,name));
  const rows=[];
  for(const d of snap.docs){
    rows.push(await hydrateFirestoreRecord({__docId:d.id,...d.data()}));
  }
  return rows;
}

async function syncFirestoreCollection(name,records){
  const fb=getFirebase();
  if(!fb)return;
  const existing=await fb.getDocs(fb.collection(fb.db,name));
  const wanted=new Set();
  const rows=(Array.isArray(records)?records:[]).map((r,i)=>({r,id:firestoreIdFor(name,r,i)}));

  // Firestore batches are limited to 500 writes. Keep a safe margin.
  let batch=fb.writeBatch(fb.db);
  let ops=0;
  const flush=async()=>{
    if(!ops)return;
    await batch.commit();
    batch=fb.writeBatch(fb.db);
    ops=0;
  };

  for(const {r,id} of rows){
    wanted.add(id);
    const prepared=await prepareFirestoreRecord(name,r,id);
    batch.set(fb.doc(fb.db,name,id),prepared,{merge:false});
    ops++;
    if(ops>=450)await flush();
  }
  for(const d of existing.docs){
    if(!wanted.has(d.id)){
      batch.delete(d.ref);
      ops++;
      if(ops>=450)await flush();
    }
  }
  await flush();
}

function getDeviceId(){
  let id=localStorage.getItem('ais_device_id');
  if(!id){
    id='dev_'+Date.now()+'_'+Math.random().toString(36).slice(2,10);
    localStorage.setItem('ais_device_id',id);
  }
  return id;
}

async function syncFavoritesToFirestore(){
  const fb=getFirebase();
  if(!fb)return;
  await fb.setDoc(
    fb.doc(fb.db,'favorites',getDeviceId()),
    {
      deviceId:getDeviceId(),
      items:cleanForFirestore(localDB.favorites||[]),
      updatedAt:new Date().toISOString()
    },
    {merge:true}
  );
}

async function loadFavoritesFromFirestore(){
  const fb=getFirebase();
  if(!fb)return;
  const snap=await fb.getDoc(fb.doc(fb.db,'favorites',getDeviceId()));
  if(snap.exists()&&Array.isArray(snap.data().items)){
    localDB.favorites=snap.data().items;
  }
}

let firestoreWriteChain=Promise.resolve();

async function syncAllToFirestore(){
  const fb=getFirebase();
  if(!fb)return false;
  firestoreWriteChain=firestoreWriteChain.then(async()=>{
    for(const name of FIRESTORE_COLLECTIONS){
      await syncFirestoreCollection(name,localDB[name]||[]);
    }
    await syncFavoritesToFirestore();
    localStorage.setItem('ais_firestore_last_sync',new Date().toISOString());
    return true;
  });
  try{return await firestoreWriteChain;}catch(e){
    console.error('Firestore sync failed:',e);
    const code=String(e?.code||'');
    toast(code.includes('permission-denied')?'Firestore رفض العملية. تحقق من Security Rules.':'تعذر حفظ البيانات في Firestore.','error');
    return false;
  }
}

async function deleteFirestoreRecord(name,id){
  const fb=getFirebase();
  if(!fb)throw new Error('Firebase غير متصل');
  if(!firestoreInitialLoadDone)throw new Error('لم تكتمل مزامنة Firestore بعد');

  const field=FIRESTORE_ID_FIELDS[name]||'id';
  const safeId=firestoreIdFor(name,{[field]:id});
  const ref=fb.doc(fb.db,name,safeId);

  /*
   * مهم جداً: الحذف يجب أن يدخل نفس طابور الكتابة المستخدم في المزامنة.
   * غير ذلك قد يحدث هذا التسلسل:
   * 1) syncAllToFirestore يقرأ السجلات القديمة.
   * 2) deleteDoc يحذف السجل.
   * 3) syncAllToFirestore القديم يكتب السجل المحذوف من جديد.
   *
   * بوضع الحذف داخل نفس السلسلة نضمن أن الحذف يأتي بعد أي كتابة سابقة،
   * ولا توجد عملية مزامنة أقدم تستطيع إعادة السجل المحذوف.
   */
  const operation=firestoreWriteChain.then(async()=>{
    await fb.deleteDoc(ref);
    return true;
  });

  firestoreWriteChain=operation.catch(()=>{});

  return await operation;
}

function queueFirestoreSync(){
  firestoreSyncPending=true;
  if(!firestoreReady||firestoreLoading||!firestoreInitialLoadDone)return;
  clearTimeout(firestoreSyncTimer);
  firestoreSyncTimer=setTimeout(async()=>{
    if(!firestoreSyncPending||firestoreLoading)return;
    firestoreSyncPending=false;
    await syncAllToFirestore();
  },500);
}

async function initializeFirestoreData(){
  const fb=getFirebase();
  if(!fb||firestoreLoading)return;
  firestoreLoading=true;
  try{
    // Firestore is authoritative. Read every collection first.
    // An empty collection is valid after deleting its last record; never repopulate it.
    const remoteByCollection={};
    let foundAnyRemoteData=false;
    for(const name of FIRESTORE_COLLECTIONS){
      const remote=await getFirestoreCollectionRecords(name);
      remoteByCollection[name]=remote;
      if(remote.length)foundAnyRemoteData=true;
    }

    if(!foundAnyRemoteData){
      // Bootstrap the embedded demo data ONLY when the entire Firestore database is empty.
      for(const name of FIRESTORE_COLLECTIONS){
        const starter=Array.isArray(localDB[name])?localDB[name]:[];
        localDB[name]=starter;
        if(starter.length)await syncFirestoreCollection(name,starter);
      }
    }else{
      for(const name of FIRESTORE_COLLECTIONS){
        // Remote Firestore state wins, including an intentionally empty collection.
        localDB[name]=remoteByCollection[name];
      }
    }

    await loadFavoritesFromFirestore();
    if(!foundAnyRemoteData)await syncFavoritesToFirestore();

    firestoreInitialLoadDone=true;
    firestoreSyncPending=false;
    localStorage.setItem('ais_firestore_mode','firestore-only-test-mode');
    render();
    toast('تم الاتصال بـ Firestore وتحميل البيانات');
  }catch(e){
    console.error('Firestore initialization failed:',e);
    const code=String(e?.code||'');
    if(code.includes('permission-denied'))toast('تم تشغيل التطبيق، لكن Firestore يمنع القراءة/الكتابة. تحقق من Security Rules.','error');
    else toast('تعذر الاتصال بـ Firestore. تحقق من المشروع والقواعد.','error');
  }finally{
    firestoreLoading=false;
  }
}

window.addEventListener('firebase-ready',()=>{
  firestoreReady=true;
  initializeFirestoreData();
});
window.addEventListener('firebase-error',()=>{
  toast('تعذر تشغيل Firebase. تحقق من إعدادات المشروع.','error');
});

function searchAll(q){
  const term=q.trim().toLowerCase();

  const shops=publicShops().filter(s=>[s.shopName,s.description,...(s.searchKeywords||[]),catById(s.categoryId)?.name].join(' ').toLowerCase().includes(term));

function cartKey(shopId){return 'ais_cart_'+shopId;}
function getShopCart(shopId){
  try{const c=JSON.parse(localStorage.getItem(cartKey(shopId))||'[]');return Array.isArray(c)?c:[];}catch(e){return []}
}
function saveShopCart(shopId,cart){
  try{if(cart.length)localStorage.setItem(cartKey(shopId),JSON.stringify(cart));else localStorage.removeItem(cartKey(shopId));}catch(e){console.warn('تعذر حفظ السلة',e)}
}
function cartItemsCount(shopId){return getShopCart(shopId).reduce((n,x)=>n+Number(x.qty||0),0)}
function cartTotal(shopId){return getShopCart(shopId).reduce((n,x)=>n+(Number(x.price)||0)*Number(x.qty||0),0)}
function addToShopCart(shopId,productId,qty=1){
  const shop=shopById(shopId),p=productById(productId);
  if(!shop||!p||p.shopId!==shopId||!isActiveProduct(p)||!isPublicShop(shop)){toast('المنتج غير متاح','error');return}
  const offer=activeOffersForShop(shopId).find(x=>x.productId===productId)?._offer||null;
  const price=offer?.newPrice!=null?Number(offer.newPrice):Number(p.price);
  if(!Number.isFinite(price)){toast('سعر المنتج غير صالح','error');return}
  const cart=getShopCart(shopId), existing=cart.find(x=>x.productId===productId);
  if(existing){existing.qty=Math.min(99,Number(existing.qty||0)+Math.max(1,Number(qty)||1));existing.price=price;existing.name=p.name;existing.image=p.image||'';existing.offer=offer?{oldPrice:Number(offer.oldPrice),newPrice:Number(offer.newPrice),startAt:offer.startAt,endAt:offer.endAt}:null;}
  else cart.push({productId:p.productId,name:p.name,image:p.image||'',price,qty:Math.min(99,Math.max(1,Number(qty)||1)),offer:offer?{oldPrice:Number(offer.oldPrice),newPrice:Number(offer.newPrice),startAt:offer.startAt,endAt:offer.endAt}:null});
  saveShopCart(shopId,cart);toast('تمت إضافة المنتج إلى السلة');renderShopCart(shopId);
}
function changeCartQty(shopId,productId,delta){
  const cart=getShopCart(shopId),item=cart.find(x=>x.productId===productId);if(!item)return;
  item.qty=Math.min(99,Math.max(0,Number(item.qty||0)+delta));
  const next=cart.filter(x=>x.qty>0);saveShopCart(shopId,next);renderShopCart(shopId);
}
function removeCartItem(shopId,productId){saveShopCart(shopId,getShopCart(shopId).filter(x=>x.productId!==productId));renderShopCart(shopId)}
function clearShopCart(shopId){saveShopCart(shopId,[]);renderShopCart(shopId)}
function openShopCart(shopId){renderShopCart(shopId);document.getElementById('cartOverlay')?.classList.add('show')}
function closeShopCart(){document.getElementById('cartOverlay')?.classList.remove('show')}
function cartMessage(shopId){
  const shop=shopById(shopId),cart=getShopCart(shopId);if(!shop||!cart.length)return '';
  let msg=`مرحباً، أريد إرسال طلب من محل ${shop.shopName}.%0A%0Aتفاصيل الطلب:%0A`;
  msg=decodeURIComponent(msg);
  cart.forEach((x,i)=>{
    msg+=`${i+1}) ${x.name} — العدد: ${x.qty} — السعر للوحدة: ${Number(x.price).toFixed(2)} د.أ — المجموع: ${(Number(x.price)*Number(x.qty)).toFixed(2)} د.أ\n`;
    if(x.offer)msg+=`   عرض خاص: السعر القديم ${x.offer.oldPrice.toFixed(2)} د.أ، السعر الجديد ${x.offer.newPrice.toFixed(2)} د.أ، من ${x.offer.startAt} إلى ${x.offer.endAt}\n`;
  });
  msg+=`\nعدد القطع: ${cartItemsCount(shopId)}\nالمجموع الكلي: ${cartTotal(shopId).toFixed(2)} د.أ\n\nأرجو تأكيد الطلب والتواصل معي عبر WhatsApp.`;
  return msg;
}
function sendShopCart(shopId){
  const shop=shopById(shopId),cart=getShopCart(shopId);if(!shop||!cart.length){toast('السلة فارغة','error');return}
  const number=shop.whatsapp||shop.phone;if(!number){toast('لا يوجد رقم WhatsApp لهذا المحل','error');return}
  const message=cartMessage(shopId);whatsapp(number,message);saveShopCart(shopId,[]);closeShopCart();toast('تم إرسال الطلب وتفريغ السلة');render();
}
function shopCartUI(shopId){
  const count=cartItemsCount(shopId);
  return `<button class="cart-fab" onclick="openShopCart('${esc(shopId)}')" aria-label="سلة التسوق">🛒 السلة <span class="cart-count" id="cartCount">${count}</span></button>
  <div id="cartOverlay" class="cart-overlay" onclick="if(event.target===this)closeShopCart()"><div id="cartPanel" class="cart-panel"></div></div>`;
}
function renderShopCart(shopId){
  const panel=document.getElementById('cartPanel');if(!panel)return;
  const shop=shopById(shopId),cart=getShopCart(shopId);
  panel.innerHTML=`<div class="modal-head"><h2>🛒 سلة ${esc(shop?.shopName||'المحل')}</h2><button class="close" onclick="closeShopCart()">×</button></div>${cart.length?cart.map(x=>`<div class="cart-item"><img src="${esc(x.image||'')}" alt="${esc(x.name)}" onerror="this.style.visibility='hidden'"><div><b>${esc(x.name)}</b>${x.offer?`<div class="meta">عرض خاص: ${x.offer.oldPrice.toFixed(2)} ← ${x.offer.newPrice.toFixed(2)} د.أ</div>`:''}<div class="meta">${Number(x.price).toFixed(2)} د.أ × ${x.qty} = ${(Number(x.price)*Number(x.qty)).toFixed(2)} د.أ</div></div><div class="qty"><button onclick="changeCartQty('${esc(shopId)}','${esc(x.productId)}',1)">+</button><b>${x.qty}</b><button onclick="changeCartQty('${esc(shopId)}','${esc(x.productId)}',-1)">−</button></div></div>`).join('')+`<div class="cart-total"><span>عدد القطع</span><span>${cartItemsCount(shopId)}</span></div><div class="cart-total"><span>المجموع الكلي</span><span>${cartTotal(shopId).toFixed(2)} د.أ</span></div><div class="cart-note">سيتم إرسال تفاصيل كل المنتجات والأسعار والعروض إلى WhatsApp الخاص بهذا المحل. بعد الإرسال تُفرّغ السلة تلقائياً.</div><div class="product-actions"><button class="btn danger" onclick="clearShopCart('${esc(shopId)}')">تفريغ السلة</button><button class="btn full" onclick="sendShopCart('${esc(shopId)}')">📤 إرسال الطلب عبر WhatsApp</button></div>`:`<div class="empty">السلة فارغة حالياً.<br><span class="muted">اختر المنتجات من هذا المحل لإضافتها إلى السلة.</span></div>`}`;
}

async function fileToDataUrl(file, options={}){
  if(!file)throw new Error('لم يتم اختيار صورة');
  if(!String(file.type||'').startsWith('image/'))throw new Error('الملف المختار ليس صورة');
  const maxWidth=Math.max(1,Number(options.maxWidth||1400));
  const maxHeight=Math.max(1,Number(options.maxHeight||1400));
  const maxChars=Math.max(120000,Number(options.maxChars||820000));
  let source=null,objectUrl=null;
  try{
    if(typeof createImageBitmap==='function')source=await createImageBitmap(file);
    else{
      objectUrl=URL.createObjectURL(file);
      source=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('تعذر قراءة الصورة'));img.src=objectUrl;});
    }
    const sw=source.width||source.naturalWidth,sh=source.height||source.naturalHeight;
    if(!sw||!sh)throw new Error('أبعاد الصورة غير صالحة');
    const scale=Math.min(1,maxWidth/sw,maxHeight/sh);
    const w=Math.max(1,Math.round(sw*scale)),h=Math.max(1,Math.round(sh*scale));
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext('2d');if(!ctx)throw new Error('المتصفح لا يدعم معالجة الصور');
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(source,0,0,w,h);
    let quality=Number(options.quality||.78);let data='';
    for(let i=0;i<6;i++){
      data=canvas.toDataURL('image/jpeg',Math.min(.9,Math.max(.45,quality)));
      if(data.length<=maxChars)break;
      quality-=.07;
    }
    if(data.length>maxChars)throw new Error('الصورة كبيرة جداً بعد الضغط. اختر صورة أصغر أو صورة أبسط.');
    return data;
  }finally{
    if(source&&typeof source.close==='function')source.close();
    if(objectUrl)URL.revokeObjectURL(objectUrl);
  }
}

  if(hash!=='8dc7d23e1b51978c7686804dd4b4e6c41f34b32556831683845a7f68b6ab3a18'){toast('كلمة مرور الإدارة غير صحيحة','error');return}
  State.adminUnlocked=true;sessionStorage.setItem('admin_unlocked','1');toast('تم فتح لوحة الإدارة');setRoute('admin-panel');
}
async function sha256(text){
  const data=new TextEncoder().encode(text);
  const hash=await crypto.subtle.digest('SHA-256',data);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function openScheduleDatePicker(formId,fieldName,label){
  const form=document.getElementById(formId);

  const min=startFieldName?(form.elements[startFieldName]?.value||''):'';
  const pickerId='scheduleCalendar_'+Date.now();

  $('#datePickerBox').innerHTML=`
    <div class="modal-head">
      <h2>${esc(label||'اختيار التاريخ')}</h2>
      <button type="button" class="close" aria-label="إغلاق" onclick="closeDatePicker()">×</button>
    </div>
    <div id="${pickerId}" class="schedule-calendar"
         data-form="${esc(formId)}" data-field="${esc(fieldName)}"
         data-selected="${esc(current)}" data-min="${esc(min)}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <button type="button" class="btn secondary" onclick="changeScheduleCalendar('${pickerId}',-1)">‹</button>

        <button type="button" class="btn secondary" onclick="changeScheduleCalendar('${pickerId}',1)">›</button>
      </div>

      <div style="display:flex;gap:8px;margin-top:12px">
        <button type="button" class="btn secondary" style="flex:1" onclick="closeDatePicker()">إلغاء</button>
        <button type="button" class="btn gold" style="flex:1" onclick="insertScheduleDateFromCalendar('${pickerId}')">📅 إدراج</button>
      </div>
    </div>`;

  const root=document.getElementById(pickerId);
  let base=current?new Date(current+'T00:00:00'):new Date();
  if(Number.isNaN(base.getTime()))base=new Date();
  root.dataset.year=String(base.getFullYear());
  root.dataset.month=String(base.getMonth());
  $('#datePickerOverlay').style.display='flex';
  $('#datePickerOverlay').setAttribute('aria-hidden','false');
  renderScheduleCalendar(pickerId);
}

function renderScheduleCalendar(id){
  const root=document.getElementById(id);
  if(!root)return;
  const y=Number(root.dataset.year),m=Number(root.dataset.month);
  const selected=root.dataset.selected||'',min=root.dataset.min||'';
  const title=document.getElementById(id+'_title'),grid=document.getElementById(id+'_grid');
  if(!title||!grid)return;

  title.textContent=new Intl.DateTimeFormat('ar-JO',{month:'long',year:'numeric'}).format(new Date(y,m,1));
  grid.innerHTML='';
  ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'].forEach(n=>{
    const h=document.createElement('div');
    h.textContent=n;h.style.cssText='text-align:center;font-size:11px;font-weight:800;padding:5px';
    grid.appendChild(h);
  });

  const first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate();
  for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));

  for(let day=1;day<=total;day++){
    const value=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const b=document.createElement('button');
    b.type='button';b.className='btn secondary';b.textContent=day;
    b.style.cssText='padding:9px 0;min-width:0';
    if(value===selected)b.style.outline='3px solid var(--gold)';
    if(min&&value<min){
      b.disabled=true;b.style.opacity='.35';
    }else{
      b.onclick=function(){root.dataset.selected=value;renderScheduleCalendar(id);};
    }
    grid.appendChild(b);
  }
}

function changeScheduleCalendar(id,delta){
  const root=document.getElementById(id);
  if(!root)return;
  const d=new Date(Number(root.dataset.year),Number(root.dataset.month)+delta,1);
  root.dataset.year=String(d.getFullYear());
  root.dataset.month=String(d.getMonth());
  renderScheduleCalendar(id);
}

function insertScheduleDateFromCalendar(id){
  const root=document.getElementById(id);
  if(!root)return;
  const form=document.getElementById(root.dataset.form);
  const fieldName=root.dataset.field;
  const selected=root.dataset.selected||'';
  if(!form||!selected){toast('اختر التاريخ أولاً','error');return}

  const startFieldName=fieldName.endsWith('EndAt')?fieldName.replace(/EndAt$/,'StartAt'):(fieldName==='endAt'?'startAt':'');
  const endFieldName=fieldName.endsWith('StartAt')?fieldName.replace(/StartAt$/,'EndAt'):(fieldName==='startAt'?'endAt':'');
  if(startFieldName&&fieldName!==startFieldName){
    const start=form.elements[startFieldName]?.value||'';
    if(start&&selected<start){
      toast('تاريخ النهاية يجب أن يكون بعد أو يساوي تاريخ البداية','error');
      return;
    }
  }
  if(endFieldName&&fieldName!==endFieldName){
    const end=form.elements[endFieldName]?.value||'';
    if(end&&selected>end)form.elements[endFieldName].value='';
  }

  form.elements[fieldName].value=selected;
  closeDatePicker();
  toast('تم إدراج التاريخ مباشرة في الخانة');
}

function closeDatePicker(){
  const overlay=$('#datePickerOverlay');
  if(overlay){
    overlay.style.display='none';
    overlay.setAttribute('aria-hidden','true');
  }

function saveOfferForm(f,shopId,offerId){
  const product=productById(f.productId.value);

  const start=f.startAt.value,end=f.endAt.value,oldPrice=Number(f.oldPrice.value),newPrice=Number(f.newPrice.value);
  if(!start||!end||end<start){toast('تاريخ نهاية العرض يجب أن يكون بعد أو يساوي تاريخ البداية','error');return}

async function confirmDeleteShop(id){
  const s=shopById(id);if(!s)return;
  try{
    const productIds=localDB.products.filter(x=>x.shopId===id).map(x=>x.productId);
    const offerIds=localDB.specialOffers.filter(x=>x.shopId===id).map(x=>x.offerId);
    const requestIds=localDB.promotionRequests.filter(x=>x.shopId===id).map(x=>x.requestId);
    const serviceIds=localDB.services.filter(x=>x.shopId===id).map((x,i)=>x.serviceId||('service_'+id+'_'+i));
    await deleteFirestoreRecord('shops',id);
    if(s.ownerId)await deleteFirestoreRecord('users',s.ownerId);
    for(const x of productIds)await deleteFirestoreRecord('products',x);
    for(const x of offerIds)await deleteFirestoreRecord('specialOffers',x);

window.addEventListener('keydown',e=>{
  if(!$('#modal')?.classList.contains('show'))return;
  if(e.key==='Escape'){closeModal();return}
  if(e.key==='Tab'){
    const els=[...$('#modalBox').querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);
    if(!els.length)return;const first=els[0],last=els[els.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

let deferredInstallPrompt=null;
function isAppInstalled(){return window.matchMedia?.('(display-mode: standalone)').matches||window.navigator.standalone===true||localStorage.getItem('ais_app_installed')==='1'}
function updateInstallButton(){const b=document.getElementById('installFab');if(b)b.classList.toggle('show',!isAppInstalled())}
window.addEventListener('load',()=>setTimeout(updateInstallButton,100));
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;updateInstallButton()});
window.addEventListener('appinstalled',()=>{localStorage.setItem('ais_app_installed','1');deferredInstallPrompt=null;updateInstallButton()});
async function requestAppInstall(){
  if(isAppInstalled()){updateInstallButton();return}
  $('#modalBox').innerHTML=`<div class="modal-head"><h2 id="modalTitle">📲 تحميل التطبيق</h2><button class="close" onclick="closeModal()">×</button></div>

    <button class="btn gold full" onclick="confirmAppInstall()">نعم</button>

  openModal();
}
async function confirmAppInstall(){
  if(!deferredInstallPrompt){
    closeModal();
    toast('المتصفح لم يجهّز التثبيت حالياً','error');
    return;
  }
  const p=deferredInstallPrompt;
  deferredInstallPrompt=null;
  closeModal();
  try{
    await p.prompt();
    const r=await p.userChoice;
    if(r?.outcome==='accepted')localStorage.setItem('ais_app_installed','1');
  }catch(e){console.warn(e)}
  updateInstallButton();
}

function shopIsOpen(s){
  const raw=String(s?.workingHours||'').trim();
  if(!raw)return null;
  const m=raw.match(/(\d{1,2}):(\d{2})\s*(صباحاً|صباحا|مساءً|مساء)\s*-\s*(\d{1,2}):(\d{2})\s*(صباحاً|صباحا|مساءً|مساء)/i);
  if(!m)return null;
  const toMin=(h,mi,period)=>{h=Number(h);mi=Number(mi);if(/مساء/.test(period)&&h<12)h+=12;if(/صباح/.test(period)&&h===12)h=0;return h*60+Number(mi)};
  const start=toMin(m[1],m[2],m[3]),end=toMin(m[4],m[5],m[6]);
  const now=new Date(),cur=now.getHours()*60+now.getMinutes();
  return start<=end?cur>=start&&cur<=end:(cur>=start||cur<=end);
}
function shopStatusHtml(s){
  const open=shopIsOpen(s);

}

function openShopFeaturedForm(id){
  const s=shopById(id);if(!s)return;const formId='shopFeature_'+Date.now();
  $('#modalBox').innerHTML=`<div class="modal-head"><h2 id="modalTitle">⭐ تمييز المحل</h2><button class="close" onclick="closeModal()">×</button></div><form id="${formId}" onsubmit="event.preventDefault();saveShopFeatured(this,'${esc(id)}')"><div class="form-grid"><div class="notice"><b>${esc(s.shopName)}</b><br>حدد فترة ظهور المحل ضمن «المحلات المميزة».</div><div class="field"><label>حالة التمييز</label><select name="featured"><option value="on" ${s.isFeatured?'selected':''}>⭐ تفعيل التمييز</option><option value="off" ${!s.isFeatured?'selected':''}>إلغاء التمييز</option></select></div><div class="form-grid two"><div class="field"><label>من تاريخ</label><input name="startAt" type="text" value="${esc(s.featuredStartAt||today())}" readonly onclick="openScheduleDatePicker('${formId}','startAt','تاريخ بداية تمييز المحل')"></div><div class="field"><label>إلى تاريخ</label><input name="endAt" type="text" value="${esc(s.featuredEndAt||'')}" readonly onclick="openScheduleDatePicker('${formId}','endAt','تاريخ نهاية تمييز المحل')"></div></div><button class="btn full">حفظ حالة التمييز</button></div></form>`;openModal();
}
function openAdminProductForm(pid){
  const p=productById(pid);if(!p)return;const formId='adminProductFeature_'+Date.now();
  $('#modalBox').innerHTML=`<div class="modal-head"><h2 id="modalTitle">⭐ تمييز المنتج للواجهة</h2><button class="close" onclick="closeModal()">×</button></div><form id="${formId}" onsubmit="event.preventDefault();saveAdminProductFeatured(this,'${esc(pid)}')"><div class="form-grid"><div class="notice"><b>${esc(p.name)}</b><br>${esc(shopById(p.shopId)?.shopName||'')}</div><label class="chip" style="width:max-content"><input name="adminFeatured" type="checkbox" ${p.adminFeatured?'checked':''}> ⭐ إظهار المنتج ضمن المنتجات المميزة</label><div class="form-grid two"><div class="field"><label>من تاريخ</label><input name="adminFeaturedStartAt" type="text" value="${esc(p.adminFeaturedStartAt||today())}" readonly onclick="openScheduleDatePicker('${formId}','adminFeaturedStartAt','تاريخ بداية تمييز المنتج')"></div><div class="field"><label>إلى تاريخ</label><input name="adminFeaturedEndAt" type="text" value="${esc(p.adminFeaturedEndAt||'')}" readonly onclick="openScheduleDatePicker('${formId}','adminFeaturedEndAt','تاريخ نهاية تمييز المنتج')"></div></div><button class="btn full">حفظ التمييز</button></div></form>`;openModal();
}
function openProductForm(shopId,pid=''){
  const p=pid?productById(pid):{name:'',description:'',price:'',image:'',isFeatured:false,featuredStartAt:'',featuredEndAt:''};
  const featured=!!isFeatured(p),formId='productForm_'+shopId+'_'+(pid||'new');
  $('#modalBox').innerHTML=`<div class="modal-head"><h2 id="modalTitle">${pid?'تعديل المنتج':'إضافة منتج'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="${formId}" onsubmit="event.preventDefault();saveProductForm(this,'${esc(shopId)}','${esc(pid)}')"><div class="form-grid"><div class="field"><label>اسم المنتج</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>الوصف</label><textarea name="description">${esc(p.description)}</textarea></div><div class="field"><label>السعر</label><input name="price" type="number" step="0.01" min="0" value="${esc(p.price)}" required></div><div class="field"><label>الصورة</label><input id="productFormImageUrl" name="imageUrl" value="${esc(p.image||'')}" placeholder="رابط صورة (اختياري)"><input type="file" accept="image/*" onchange="loadProductImage(this)"><img id="productPreview" class="preview ${p.image?'':'hidden'}" src="${esc(p.image||'')}" onerror="this.style.display='none'"></div><label class="chip"><input name="featured" type="checkbox" ${featured?'checked':''} onchange="this.form.featuredStartAt.disabled=!this.checked;this.form.featuredEndAt.disabled=!this.checked"> ⭐ تمييز المنتج داخل صفحة المحل</label><div class="form-grid two"><div class="field"><label>بداية التمييز</label><input name="featuredStartAt" type="text" value="${esc(p.featuredStartAt||today())}" readonly ${featured?'':'disabled'} onclick="openScheduleDatePicker('${formId}','featuredStartAt','تاريخ بداية تمييز المنتج')"></div><div class="field"><label>نهاية التمييز</label><input name="featuredEndAt" type="text" value="${esc(p.featuredEndAt||'')}" readonly ${featured?'':'disabled'} onclick="openScheduleDatePicker('${formId}','featuredEndAt','تاريخ نهاية تمييز المنتج')"></div></div><button class="btn full">حفظ المنتج</button></div></form>`;openModal();
}
function openOwnerProductFeaturedForm(pid){
  const p=productById(pid);if(!p)return;const on=!!isFeatured(p),formId='ownerFeatureForm_'+Date.now();
  $('#modalBox').innerHTML=`<div class="modal-head"><h2 id="modalTitle">⭐ تمييز المنتج داخل المحل</h2><button class="close" onclick="closeModal()">×</button></div><form id="${formId}" onsubmit="event.preventDefault();saveOwnerProductFeatured(this,'${esc(pid)}')"><div class="form-grid"><div class="notice"><b>${esc(p.name)}</b><br>سيظهر التمييز داخل صفحة محلك فقط.</div><label class="chip"><input name="featured" type="checkbox" ${on?'checked':''} onchange="this.form.startAt.disabled=!this.checked;this.form.endAt.disabled=!this.checked||this.form.noEnd.checked"> ⭐ تمييز المنتج</label><div class="form-grid two"><div class="field"><label>من تاريخ</label><input name="startAt" type="text" value="${esc(p.featuredStartAt||today())}" readonly ${on?'':'disabled'} onclick="openScheduleDatePicker('${formId}','startAt','تاريخ بداية التمييز')"></div><div class="field"><label>إلى تاريخ</label><input name="endAt" type="text" value="${esc(p.featuredEndAt||'')}" readonly ${on&&!p.featuredEndAt?'disabled':''} onclick="openScheduleDatePicker('${formId}','endAt','تاريخ نهاية التمييز')"></div></div><label class="chip"><input name="noEnd" type="checkbox" ${on&&!p.featuredEndAt?'checked':''} onchange="this.form.endAt.disabled=this.checked||!this.form.featured.checked;if(this.checked)this.form.endAt.value=''"> مستمر بدون تاريخ انتهاء</label><button class="btn full">حفظ التمييز</button></div></form>`;openModal();
}

</script>

</body>
</html>
